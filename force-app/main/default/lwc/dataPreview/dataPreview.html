<template>
    <div class="slds-card">
        <lightning-card title="Data Management" icon-name="standard:data_model">
            <div slot="actions">
                <lightning-button-group>
                    <lightning-button label="Preview Data" variant="brand" onclick={generatePreview}></lightning-button>
                    <lightning-button label="Insert Previewed Data" variant="success" onclick={handleInsert} disabled={isDataEmpty}></lightning-button>
                    <lightning-button label="Generate & Insert Directly" variant="destructive" onclick={generateAndInsertDirectly}></lightning-button>
                </lightning-button-group>
            </div>
            
            <div class="slds-p-horizontal_small">
                <!-- Object Selector -->
                <template if:true={objectOptions.length}>
                    <div class="slds-m-bottom_small">
                        <lightning-combobox
                            label="Select Object"
                            placeholder="Choose an object to preview"
                            value={displayedObject}
                            options={objectOptions}
                            onchange={handleObjectChange}>
                        </lightning-combobox>
                    </div>
                </template>
                
                <!-- Success Message -->
                <template if:true={successMessage}>
                    <div class="slds-m-vertical_small">
                        <div class="slds-notify slds-notify_alert slds-alert_success" role="alert">
                            <span class="slds-assistive-text">Success</span>
                            <lightning-icon icon-name="utility:success" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                            <h2>{successMessage}</h2>
                        </div>
                    </div>
                </template>
                
                <!-- Error Message -->
                <template if:true={error}>
                    <div class="slds-m-vertical_small">
                        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                            <span class="slds-assistive-text">Error</span>
                            <lightning-icon icon-name="utility:error" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                            <h2>{error}</h2>
                        </div>
                    </div>
                </template>
                
                <!-- Unable to read SObject Error -->
                <template if:true={noValidRecords}>
                    <div class="slds-m-vertical_small">
                        <div class="slds-box slds-theme_error">
                            <div class="slds-media">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="utility:ban" alternative-text="Error" size="small" variant="error"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-text-heading_small">Unable to read SObject</h2>
                                    <p>Unable to read properties for the selected object. Please try generating data again or check your configuration.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
                
                <!-- Data Table -->
                <template if:true={previewData.length}>
                    <div class="slds-border_top slds-m-top_small slds-p-top_small">
                        <div class="slds-m-bottom_small">
                            <div class="slds-text-heading_small slds-p-bottom_x-small">
                                <span class="slds-text-title_caps">Previewing:</span> 
                                {displayedObject} - {previewData.length} Records
                            </div>
                        </div>
                        <lightning-datatable
                            key-field="key"
                            data={previewData}
                            columns={columns}
                            hide-checkbox-column
                            resize-column-disabled="false"
                            min-column-width="120">
                        </lightning-datatable>
                    </div>
                </template>
                
                <!-- Empty State -->
                <template if:true={isDataEmpty}>
                    <div class="slds-illustration slds-illustration_small" role="presentation">
                        <div class="slds-text-longform">
                            <h3 class="slds-text-heading_medium">No data to preview</h3>
                            <p class="slds-text-body_regular">Click "Preview Data" to see sample data or "Generate & Insert Directly" to create records without preview.</p>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-is-relative slds-m-top_small">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
        </lightning-card>
    </div>
</template>
