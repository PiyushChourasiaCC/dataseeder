<template>
    <div class="slds-card">
        <lightning-card title="DataSeeder Configuration" icon-name="standard:template">
            <div slot="actions">
                <lightning-button-group>
                    <lightning-button label="New Template" onclick={handleNewTemplate}></lightning-button>
                    <lightning-button label="Edit" onclick={handleEditTemplate} disabled={disableTemplateActions}></lightning-button>
                    <lightning-button label="Clone" onclick={handleCloneTemplate} disabled={disableTemplateActions}></lightning-button>
                    <lightning-button label="Delete" onclick={handleDeleteTemplate} disabled={disableTemplateActions} variant="destructive"></lightning-button>
                </lightning-button-group>
            </div>
            
            <div class="slds-p-horizontal_small">
                <!-- Template Selection -->
                <div class="slds-m-bottom_small">
                    <lightning-combobox
                        label="Select Template"
                        placeholder="Choose a template"
                        value={selectedTemplateId}
                        options={templates}
                        onchange={handleTemplateChange}>
                    </lightning-combobox>
                </div>
                
                <!-- Configuration Panel -->
                <lightning-accordion allow-multiple-sections-open>
                    <!-- Context Configuration -->
                    <lightning-accordion-section name="context" label="Context Settings">
                        <div class="slds-grid slds-gutters">
                            <div class="slds-col">
                                <lightning-combobox
                                    name="locale"
                                    label="Locale"
                                    value={contextSettings.locale}
                                    placeholder="Select locale"
                                    options={localeOptions}
                                    onchange={handleContextChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <lightning-combobox
                                    name="industry"
                                    label="Industry Context"
                                    value={contextSettings.industry}
                                    placeholder="Select industry"
                                    options={industryOptions}
                                    onchange={handleContextChange}>
                                </lightning-combobox>
                            </div>
                            <div class="slds-col">
                                <lightning-combobox
                                    name="region"
                                    label="Region Context"
                                    value={contextSettings.region}
                                    placeholder="Select region"
                                    options={regionOptions}
                                    onchange={handleContextChange}>
                                </lightning-combobox>
                            </div>
                        </div>
                    </lightning-accordion-section>
                    
                    <!-- Object Configuration -->
                    <lightning-accordion-section name="objects" label="Object Configuration">
                        <div class="slds-grid slds-gutters slds-m-bottom_small">
                            <div class="slds-col slds-size_3-of-4 slds-p-top_medium">
                                <lightning-button
                                    label="Configure Objects"
                                    variant="brand"
                                    onclick={handleConfigureObjects}
                                    class="slds-m-bottom_small">
                                </lightning-button>

                                <template if:true={showObjectSelector}>
                                    <div class="slds-box slds-m-top_small">
                                        <lightning-combobox
                                            label="Select Object"
                                            placeholder="Choose an object"
                                            value={selectedObject}
                                            options={objectOptions}
                                            onchange={handleObjectChange}>
                                        </lightning-combobox>
                                    </div>
                                </template>
                            </div>
                            <div class="slds-col slds-size_1-of-4">
                                <lightning-input 
                                    type="number" 
                                    label="Number of Records" 
                                    value={recordCount}
                                    min="1"
                                    max={MAX_TOTAL_RECORDS}
                                    message-when-range-overflow={rangeOverflowMessage}
                                    message-when-range-underflow="At least 1 record is required"
                                    onchange={handleRecordCountChange}>
                                </lightning-input>
                            </div>
                        </div>
                        
                        <!-- Field Configuration -->
                        <div class="slds-m-top_small">
                            <lightning-button
                                label="Configure Fields"
                                variant="brand"
                                onclick={handleConfigureFields}
                                disabled={disableFieldConfig}
                                class="slds-m-bottom_small">
                            </lightning-button>

                            <template if:true={showFieldSelector}>
                                <div class="slds-box slds-m-top_small">
                                    <lightning-dual-listbox
                                        name="fields"
                                        label={fieldSelectionLabel}
                                        source-label="Available Fields"
                                        selected-label="Selected Fields"
                                        options={fieldOptions}
                                        value={selectedFieldValues}
                                        onchange={handleFieldSelection}>
                                    </lightning-dual-listbox>
                                </div>
                            </template>
                        </div>
                        
                        <!-- Selected Fields Display -->
                        <template if:true={selectedFields.length}>
                            <div class="slds-m-top_small">
                                <div class="slds-text-heading_small slds-m-bottom_x-small">Selected Fields:</div>
                                <div class="slds-box">
                                    <lightning-datatable
                                        key-field="name"
                                        data={selectedFields}
                                        columns={fieldColumns}
                                        hide-checkbox-column>
                                    </lightning-datatable>
                                </div>
                            </div>
                        </template>
                    </lightning-accordion-section>
                </lightning-accordion>
            </div>
            
            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-is-relative slds-m-top_small">
                    <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                </div>
            </template>
        </lightning-card>
    </div>
    
    <!-- Template Modal -->
    <template if:true={showTemplateModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleModalClose}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <template if:true={isEdit}>
                        <h2 id="modal-heading-edit" class="slds-modal__title slds-hyphenate">Edit Template</h2>
                    </template>
                    <template if:false={isEdit}>
                        <h2 id="modal-heading-new" class="slds-modal__title slds-hyphenate">New Template</h2>
                    </template>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-input
                        label="Template Name"
                        name="name"
                        value={templateData.name}
                        required
                        onchange={handleTemplateInputChange}>
                    </lightning-input>
                    <lightning-textarea
                        label="Description"
                        name="description"
                        value={templateData.description}
                        onchange={handleTemplateInputChange}>
                    </lightning-textarea>
                    <lightning-textarea
                        label="Configuration JSON"
                        name="configJson"
                        value={templateData.configJson}
                        rows="10"
                        disabled={disableConfigJson}
                        onchange={handleTemplateInputChange}>
                    </lightning-textarea>
                    <lightning-input
                        type="checkbox"
                        label="Active"
                        name="isActive"
                        checked={templateData.isActive}
                        onchange={handleTemplateInputChange}>
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleModalClose}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handleSaveTemplate}>Save</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
